{% extends "base.html" %}
{% block titulo %}iniciar sesión{% endblock %}
{% block contenido %}
<section class="tarjeta formulario">
    <div class="insignia insignia-menta">♡</div>
    <p class="etiqueta">qué lindo verte</p>
    <h1>iniciá sesión</h1>
    <p class="descripcion">Volvé a tu espacio y seguí con tus pendientes.</p>
    <form id="formulario-login">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" autocomplete="username" required>
        <label for="contraseña">Contraseña</label>
        <input id="contraseña" name="contraseña" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
    </form>
    <p class="enlace">¿Es tu primera vez? <a href="{{ url_for('pagina_registro') }}">Creá tu cuenta</a></p>
</section>
{% endblock %}
{% block scripts %}<script>
const formulario = document.querySelector("#formulario-login");
formulario.addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const mensaje = document.querySelector("#mensaje");
    const datos = Object.fromEntries(new FormData(formulario));
    try {
        const respuesta = await fetch("/login", {
            method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(datos)
        });
        const resultado = await respuesta.json();
        mensaje.textContent = resultado.mensaje;
        mensaje.className = `mensaje ${respuesta.ok ? "exito" : "error"}`;
        if (respuesta.ok) window.location.href = "/tareas";
    } catch (error) {
        mensaje.textContent = "No se pudo conectar con el servidor.";
        mensaje.className = "mensaje error";
    }
});
</script>{% endblock %}
